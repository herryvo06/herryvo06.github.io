      content="Uy (Herry) Vo, Math + CS student at Knox College building data pipelines. Seeking Summer 2027 Data Engineering internships."
    />
  </head>
  <body>
    <script>
      // GitHub Pages deep links: public/404.html redirects /some/path to /?/some/path.
      // Restore the real path before the app boots so React Router sees it.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
